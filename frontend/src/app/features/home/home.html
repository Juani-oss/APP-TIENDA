<section class="home">
  <app-hero-carousel [productos]="destacados()" [bannerPromo]="configuracion.bannerPromo()" />

  @if (marcas().length > 0) {
    <div class="home__seccion" appScrollReveal>
      <div class="home__seccion-header">
        <h2>Nuestras marcas</h2>
      </div>
      <app-brand-slider [marcas]="marcas()" />
    </div>
  }

  @if (cargando()) {
    <p class="home__estado">Cargando productos...</p>
  } @else if (error()) {
    <p class="home__estado home__estado--error">{{ error() }}</p>
  } @else if (gruposPorCategoria().length === 0) {
    <p class="home__estado">Todavía no hay productos cargados.</p>
  } @else {
    @for (grupo of gruposPorCategoria(); track grupo.categoriaId) {
      <div class="home__seccion" appScrollReveal>
        <app-productos-separados
          [productos]="grupo.productos"
          layout="carousel"
          [tituloPropio]="grupo.nombre"
        />
      </div>
    }
  }
</section>
