<section class="categoria-list">
  <h1>Categorías</h1>

  @if (cargando()) {
    <p class="categoria-list__estado">Cargando...</p>
  } @else if (categorias().length === 0) {
    <p class="categoria-list__estado">No hay categorías cargadas todavía.</p>
  } @else {
    <div class="categoria-list__grid">
      @for (categoria of categorias(); track categoria.id) {
        <a class="categoria-list__item" [routerLink]="['/categorias', categoria.id]">
          <h3>{{ categoria.nombre }}</h3>
          @if (categoria.descripcion) {
            <p>{{ categoria.descripcion }}</p>
          }
        </a>
      }
    </div>
  }
</section>
