server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Proxy de la API hacia el contenedor del backend.
    # ^~ le da prioridad sobre el location regex de assets estáticos de más
    # abajo (si no, /api/uploads/files/*.png caería ahí y nunca llegaría al backend).
    location ^~ /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de Angular (SPA) -> siempre servir index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        expires 30d;
        access_log off;
    }
}
