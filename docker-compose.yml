services:
  db:
    image: postgres:18-alpine
    container_name: tienda_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tienda_user
      POSTGRES_PASSWORD: tienda_pass
      POSTGRES_DB: tienda_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - tienda_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda_user -d tienda_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: tienda_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tienda_user:tienda_pass@db:5432/tienda_db
      SECRET_KEY: change-this-secret-key-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - tienda_uploads_data:/app/uploads

  web:
    build:
      context: ./frontend
    container_name: tienda_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  tienda_db_data:
  tienda_uploads_data:
